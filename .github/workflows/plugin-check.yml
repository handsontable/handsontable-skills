name: Plugin Check

# Installs the Claude Code plugin from this repo's marketplace with the latest
# Claude Code and fails if it does not load with every skill in skills/.
# `claude plugin validate` alone misses loader-only errors (e.g. "conflicting
# manifests"), and a new Claude Code release can start rejecting a manifest
# that loaded before — hence the weekly run on top of PRs.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Mondays at 06:30 UTC
    - cron: '30 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: Check plugin loads
        run: ./scripts/check-plugin.sh
