name: Dist sync

# dist/*-rag.md is generated from skills/<name>/ by scripts/build.sh, and it
# is what the Handsontable docs assistant's knowledge base ingests (from
# main). Edits to skills/ that skip the rebuild leave the docs assistant on
# stale skill text until someone happens to rebuild — that happened for 3+
# weeks in September 2026 (#17, #22, #23).
#
# On every PR that touches a skill: rebuild, and if dist/*-rag.md changed,
# commit it to the PR branch, so a reviewer edit in the GitHub UI needs no
# local build. main requires a reviewed PR, so this is the one place to fix
# it. Fork PRs can't be pushed to with this token: the job fails instead and
# says which command to run.
#
# A push made with GITHUB_TOKEN does not trigger workflows, so the bot commit
# does not re-run this check (and cannot loop).

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'scripts/build.sh'
      - 'dist/*-rag.md'

permissions:
  contents: write

concurrency:
  group: dist-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dist-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the PR branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Rebuild dist
        run: ./scripts/build.sh --skip-links

      - name: Commit the rebuilt dist (or fail on a fork)
        env:
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- dist/handsontable-rag.md dist/hyperformula-rag.md; then
            echo "dist/*-rag.md matches skills/ — nothing to do"
            exit 0
          fi
          git --no-pager diff --stat -- dist/handsontable-rag.md dist/hyperformula-rag.md
          if [ "$SAME_REPO" != "true" ]; then
            echo "::error::dist/*-rag.md is out of date with skills/. Run ./scripts/build.sh --skip-links and commit dist/handsontable-rag.md and dist/hyperformula-rag.md."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/handsontable-rag.md dist/hyperformula-rag.md
          git commit -m "Rebuild dist/*-rag.md from skills/"
          git push origin "HEAD:refs/heads/$HEAD_REF"
          echo "::notice::committed the rebuilt dist/*-rag.md to $HEAD_REF"
