name: Dist sync

# dist/*-rag.md is generated from skills/<name>/ by scripts/build.sh, and it
# is what the Handsontable docs assistant's knowledge base ingests (from
# main). Edits to skills/ that skip the rebuild leave the docs assistant on
# stale skill text until someone happens to rebuild — that happened for 3+
# weeks in September 2026 (#17, #22, #23).
#
# On every PR that touches a skill: rebuild, and if dist/*-rag.md changed,
# commit it to the PR branch, so a reviewer edit in the GitHub UI needs no
# local build. main requires a reviewed PR, so this is the one place to fix
# it. Fork PRs can't be pushed to with this token: the job fails instead and
# says which command to run.
#
# The same commit bumps the Claude Code plugin version (.claude-plugin/
# plugin.json) when the PR's version is not already higher than main's:
# Claude Code only delivers a plugin update when that version changes, and it
# sat at 1.0.0 through every skill update until 1.0.1. The bump is patch-only;
# bump minor/major by hand if you want, and the job leaves it alone. Two PRs
# open at once can both land the same version — plugin-check.yml catches that
# on main.
#
# A push made with GITHUB_TOKEN does not run workflows on its own: GitHub
# creates the bot commit's pull_request runs (this one and Plugin Check) but
# holds them as "action_required" until someone approves them (seen on #31,
# 2026-10-14). Approving is harmless: this job then finds nothing to do, so it
# cannot loop. Until then the bot commit has no completed check runs. That is fine while main requires no status checks (it requires
# one approving review only, as of 2026-10-13). If a required status check
# is ever added to main, the bot's head commit would sit at "expected" and
# block the merge: switch this push to a GitHub App token (its pushes do
# trigger workflows) or make this job fail instead of committing.

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'scripts/build.sh'
      - 'dist/*-rag.md'
      - '.claude-plugin/**'

permissions:
  contents: write

concurrency:
  group: dist-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dist-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the PR branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Rebuild dist
        run: ./scripts/build.sh --skip-links

      - name: Bump the plugin version past main's
        env:
          BASE_REPO: ${{ github.repository }}
        run: |
          # Fetch main from this repo explicitly: for a fork PR, origin is the fork.
          git fetch -q --depth=1 "https://github.com/$BASE_REPO.git" main
          ./scripts/plugin-version.sh bump FETCH_HEAD

      - name: Commit the rebuilt dist and version (or fail on a fork)
        env:
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          FILES="dist/handsontable-rag.md dist/hyperformula-rag.md .claude-plugin/plugin.json"
          if git diff --quiet -- $FILES; then
            echo "dist/*-rag.md matches skills/ and the plugin version is ahead of main — nothing to do"
            exit 0
          fi
          git --no-pager diff --stat -- $FILES
          if [ "$SAME_REPO" != "true" ]; then
            echo "::error::Generated files are out of date. Run ./scripts/build.sh --skip-links, set \"version\" in .claude-plugin/plugin.json higher than main's, and commit dist/*-rag.md and .claude-plugin/plugin.json."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "Update generated files: dist/*-rag.md, plugin version"
          git push origin "HEAD:refs/heads/$HEAD_REF"
          echo "::notice::committed generated files (dist/*-rag.md, plugin version) to $HEAD_REF"
