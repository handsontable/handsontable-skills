name: HT Skill Release

# Releases the handsontable skill independently of hyperformula.
# Tag format:
#   handsontable/v<X.Y.Z>   — Handsontable product version this skill targets
#
# Skill-only fixes (typos, broken links, no product change) can re-tag the
# same product version with a +skill.<n> suffix, e.g. handsontable/v17.0.0+skill.1.

on:
  push:
    tags:
      - 'handsontable/v*'
  # Dispatched on a tag by release-on-merge.yml (a tag pushed with
  # GITHUB_TOKEN does not trigger the push event above). Also usable by hand:
  # Run workflow → "Use workflow from" → the tag.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require a release tag
        run: |
          case "$GITHUB_REF" in
            refs/tags/handsontable/v*) ;;
            *) echo "::error::run this workflow on a handsontable/v* tag, not $GITHUB_REF"; exit 1 ;;
          esac

      - name: Parse tag
        id: tag
        run: |
          # GITHUB_REF_NAME is e.g. "handsontable/v17.0.0"
          VERSION="${GITHUB_REF_NAME##*/}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build skill archive and RAG doc
        run: ./scripts/build.sh --skip-links

      - name: Attach release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: handsontable ${{ steps.tag.outputs.version }}
          files: |
            dist/handsontable.zip
            dist/handsontable-rag.md
          generate_release_notes: true
